<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}RazorGuard{% endblock %}</title>
    <style>
        :root {
            --bg: #0f1117; --panel: #171a23; --border: #2a2e3a;
            --text: #e4e6eb; --muted: #8b8fa3;
            --high: #e5484d; --medium: #f5a623; --low: #3dd68c;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
            background: var(--bg); color: var(--text); margin: 0; padding: 0;
        }
        header {
            padding: 16px 32px; border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
        }
        header h1 { font-size: 18px; margin: 0; }
        header h1 span { color: var(--muted); font-weight: 400; }
        main { padding: 24px 32px; max-width: 1100px; margin: 0 auto; }
        .badge {
            display: inline-block; padding: 2px 10px; border-radius: 12px;
            font-size: 12px; font-weight: 600; text-transform: uppercase;
        }
        .badge.high { background: rgba(229,72,77,0.15); color: var(--high); }
        .badge.medium { background: rgba(245,166,35,0.15); color: var(--medium); }
        .badge.low { background: rgba(61,214,140,0.15); color: var(--low); }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 14px; }
        th { color: var(--muted); font-weight: 500; font-size: 12px; text-transform: uppercase; }
        tr:hover { background: rgba(255,255,255,0.02); }
        a { color: #6ea8ff; text-decoration: none; }
        a:hover { text-decoration: underline; }
        .stats { display: flex; gap: 16px; margin-bottom: 8px; }
        .stat-card {
            background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
            padding: 16px 20px; flex: 1;
        }
        .stat-card .n { font-size: 26px; font-weight: 700; }
        .stat-card .label { color: var(--muted); font-size: 13px; margin-top: 4px; }
        .filters { margin: 16px 0; }
        .filters a {
            margin-right: 8px; padding: 4px 12px; border: 1px solid var(--border);
            border-radius: 14px; font-size: 13px; color: var(--text);
        }
        .filters a.active { background: var(--text); color: var(--bg); }
        .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 16px; }
        .panel h2 { font-size: 15px; margin-top: 0; color: var(--muted); text-transform: uppercase; letter-spacing: 0.02em; }
        .evidence-item { padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
        .evidence-item:last-child { border-bottom: none; }
        .evidence-type { color: var(--muted); font-size: 11px; text-transform: uppercase; margin-right: 8px; }
        .score-row { display: flex; gap: 24px; margin-bottom: 8px; }
        .score-row div { flex: 1; }
        #chat-log { max-height: 300px; overflow-y: auto; margin-bottom: 12px; }
        .chat-msg { margin-bottom: 12px; font-size: 14px; }
        .chat-msg .role { font-size: 11px; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
        #chat-input { width: 100%; padding: 10px; background: #0f1117; border: 1px solid var(--border); color: var(--text); border-radius: 6px; }
	        .trusted-stat {
            position: relative;
            overflow: hidden;
        }

        .trusted-stat::after {
            content: "";
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(61,214,140,0.05);
            right: -20px;
            top: -20px;
        }

        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 20px 0;
        }

        .filters a {
            margin-right: 0;
            padding: 7px 14px;
            border-radius: 16px;
            transition: all 0.18s ease;
        }

        .filters a:hover {
            border-color: #58d68d;
            color: #58d68d;
            text-decoration: none;
            transform: translateY(-1px);
        }

        .trusted-panel {
            border-color: rgba(61,214,140,0.22);
            background:
                linear-gradient(
                    135deg,
                    rgba(61,214,140,0.055),
                    rgba(23,26,35,0.98) 45%
                );
        }

        .trusted-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 14px;
            margin-top: 18px;
        }

        .trusted-card {
            border: 1px solid rgba(61,214,140,0.18);
            background: rgba(15,17,23,0.62);
            border-radius: 10px;
            padding: 16px;
            transition: transform 0.18s ease, border-color 0.18s ease;
        }

        .trusted-card:hover {
            transform: translateY(-2px);
            border-color: rgba(61,214,140,0.42);
        }

        .trusted-card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 18px;
        }

        .trusted-customer {
            font-family: monospace;
            font-size: 14px;
            font-weight: 700;
        }

        .trusted-status {
            color: #58d68d;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.08em;
            margin-top: 5px;
        }

        .trusted-icon {
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: #58d68d;
            border: 1px solid rgba(61,214,140,0.3);
            background: rgba(61,214,140,0.08);
            font-weight: 700;
        }

        .trusted-metrics {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .trusted-metrics span,
        .trusted-timeline span {
            display: block;
            color: var(--muted);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-bottom: 5px;
        }

        .trusted-metrics strong {
            font-size: 13px;
        }

        .trusted-timeline {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            padding-top: 14px;
        }

        .trusted-timeline strong {
            font-size: 11px;
            font-weight: 500;
        }

        .badge.no-risk {
            background: rgba(61,214,140,0.12);
            color: #58d68d;
            border: 1px solid rgba(61,214,140,0.18);
        }

        @media (max-width: 800px) {
            .stats {
                flex-wrap: wrap;
            }

            .stat-card {
                min-width: 180px;
            }

            main {
                padding: 20px 16px;
            }

            header {
                padding: 14px 16px;
            }
        }
        button {
            padding: 8px 16px; background: #6ea8ff; border: none; border-radius: 6px;
            color: #0f1117; font-weight: 600; cursor: pointer; margin-top: 8px;
        }
    </style>
</head>
<body>
<header>
    <h1>RazorGuard <span>AI Financial Risk & Fraud Investigation</span></h1>
    <a href="/">Dashboard</a>
</header>
<main>
    {% block content %}{% endblock %}
</main>
</body>
</html>
